name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install fastapi uvicorn requests pytest allure-pytest pytest-rerunfailures
          

      - name: 启动 FastAPI 服务
        run: |
          nohup python run.py &
          sleep 3  # 等待服务启动

      - name: 运行测试
        run: |
          pytest testcases/ -v --reruns 2 --reruns-delay 1 --alluredir=allure-results

      - name: 生成 Allure 报告
        if: always()
        uses: simple-elf/allure-report-action@v1.7
        with:
          allure_results: allure-results
          allure_history: allure-history

      - name: 部署报告到 GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history